
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Notes</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f1f4fa;
  color: #222;
}

header {
  background: #263b80;
  color: white;
  padding: 20px;
  text-align: center;
}

header h2 {
  margin-bottom: 6px;
}

.container {
  width: 92%;
  max-width: 850px;
  margin: 25px auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000012;
}

h3 {
  color: #263b80;
  margin-bottom: 15px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 14px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  background: #263b80;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 7px;
  cursor: pointer;
  margin: 4px;
}

button:hover {
  opacity: 0.85;
}

.delete {
  background: #d93636;
}

.edit {
  background: #e49a20;
}

.secondary {
  background: #65718d;
}

.hidden {
  display: none;
}

.profile-info p {
  margin: 10px 0;
  line-height: 1.5;
}

.note {
  border-left: 4px solid #263b80;
  background: #f7f8fc;
  padding: 15px;
  border-radius: 7px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.note h4 {
  color: #263b80;
  margin-bottom: 7px;
}

.note small {
  color: #666;
}

.note-content {
  white-space: pre-wrap;
  margin: 12px 0;
  line-height: 1.5;
}

#message {
  color: green;
  margin: 10px 0;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h2>📚 Student Notes</h2>
  <p>Your personal study space</p>
</header>

<div class="container">

<!-- PROFILE CREATION -->

<section id="profileSection" class="card">
  <h3>Create Your Student Profile</h3>

  <form id="profileForm">
    <label>Student Name</label>
    <input id="name" type="text" placeholder="Enter your name" required>

    <label>Email Address</label>
    <input id="email" type="email" placeholder="Enter email" required>

    <label>Phone Number</label>
    <input id="phone" type="tel" placeholder="Enter phone number" required>

    <label>Register Number</label>
    <input id="regno" type="text" placeholder="Enter register number" required>

    <label>Department</label>
    <input id="department" type="text" placeholder="Example: Computer Science" required>

    <label>Semester</label>
    <select id="semester" required>
      <option value="">Select semester</option>
      <option>S1</option>
      <option>S2</option>
      <option>S3</option>
      <option>S4</option>
      <option>S5</option>
      <option>S6</option>
      <option>S7</option>
      <option>S8</option>
    </select>

    <button type="submit">Create Profile</button>
  </form>
</section>

<!-- STUDENT DASHBOARD -->

<section id="dashboard" class="hidden">

  <div class="card">
    <h3>Welcome to Your Dashboard 👋</h3>
    <div class="profile-info" id="profileDetails"></div>
    <button class="secondary" onclick="editProfile()">
      Edit Profile
    </button>
    <button class="delete" onclick="logout()">
      Logout
    </button>
  </div>

  <!-- WRITE NOTES -->

  <div class="card">
    <h3>✍️ Write Your Daily Notes</h3>

    <form id="noteForm">
      <label>Date</label>
      <input type="date" id="noteDate" required>

      <label>Subject</label>
      <input type="text" id="subject"
        placeholder="Example: Data Structures" required>

      <label>Topic</label>
      <input type="text" id="topic"
        placeholder="Enter topic name" required>

      <label>Your Notes</label>
      <textarea id="content"
        placeholder="Write your daily study notes here..."
        required></textarea>

      <button type="submit" id="saveButton">
        Save Notes
      </button>
      <button type="button" class="secondary"
        onclick="cancelEdit()">Clear</button>
    </form>

    <p id="message"></p>
  </div>

  <!-- SAVED NOTES -->

  <div class="card">
    <h3>📖 My Saved Notes</h3>

    <input type="search" id="search"
      placeholder="Search by subject or topic..."
      oninput="displayNotes()">

    <div id="notesList"></div>
  </div>

</section>

</div>

<footer>
  Student Notes Website | Study Smart 📚
</footer>

<script>

// STORAGE KEYS

const PROFILE_KEY = "studentProfile";
const NOTES_KEY = "studentDailyNotes";

let notes = JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
let editingId = null;

// SET TODAY'S DATE

document.getElementById("noteDate").value =
  new Date().toLocaleDateString("en-CA");

// SHOW EXISTING PROFILE

window.onload = function() {
  const profile = localStorage.getItem(PROFILE_KEY);

  if (profile) {
    showDashboard();
  } else {
    document.getElementById("profileSection")
      .classList.remove("hidden");
  }
};

// CREATE PROFILE

document.getElementById("profileForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  const profile = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    regno: document.getElementById("regno").value.trim(),
    department: document.getElementById("department").value.trim(),
    semester: document.getElementById("semester").value
  };

  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));

  showDashboard();
});

// DISPLAY DASHBOARD

function showDashboard() {
  const profile = JSON.parse(localStorage.getItem(PROFILE_KEY));

  document.getElementById("profileSection")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("profileDetails").innerHTML = `
    <p><b>Name:</b> ${safe(profile.name)}</p>
    <p><b>Email:</b> ${safe(profile.email)}</p>
    <p><b>Phone:</b> ${safe(profile.phone)}</p>
    <p><b>Register No:</b> ${safe(profile.regno)}</p>
    <p><b>Department:</b> ${safe(profile.department)}</p>
    <p><b>Semester:</b> ${safe(profile.semester)}</p>
  `;

  displayNotes();
}

// ESCAPE USER INPUT

function safe(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}

// SAVE NOTES

document.getElementById("noteForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  const note = {
    id: editingId || Date.now().toString(),
    date: document.getElementById("noteDate").value,
    subject: document.getElementById("subject").value.trim(),
    topic: document.getElementById("topic").value.trim(),
    content: document.getElementById("content").value.trim()
  };

  if (editingId) {
    notes = notes.map(n =>
      n.id === editingId ? note : n
    );
  } else {
    notes.push(note);
  }

  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));

  document.getElementById("message").textContent =
    editingId ? "Notes updated successfully!" :
    "Notes saved successfully!";

  cancelEdit();
  displayNotes();
});

// DISPLAY NOTES

function displayNotes() {
  const list = document.getElementById("notesList");
  const search = document.getElementById("search")
    .value.toLowerCase();

  const filtered = notes
    .filter(n =>
      (n.subject + " " + n.topic + " " + n.content)
      .toLowerCase().includes(search)
    )
    .sort((a, b) => b.date.localeCompare(a.date));

  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = "<p>No notes found. Start writing!</p>";
    return;
  }

  filtered.forEach(note => {
    const div = document.createElement("div");
    div.className = "note";

    const heading = document.createElement("h4");
    heading.textContent = note.subject;

    const date = document.createElement("small");
    date.textContent = "Date: " + note.date;

    const topic = document.createElement("p");
    topic.textContent = "Topic: " + note.topic;

    const content = document.createElement("p");
    content.className = "note-content";
    content.textContent = note.content;

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.onclick = () => editNote(note.id);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";
    del.onclick = () => deleteNote(note.id);

    div.append(heading, date, topic, content, edit, del);
    list.appendChild(div);
  });
}

// EDIT NOTES

function editNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;

  editingId = id;

  document.getElementById("noteDate").value = note.date;
  document.getElementById("subject").value = note.subject;
  document.getElementById("topic").value = note.topic;
  document.getElementById("content").value = note.content;

  document.getElementById("saveButton").textContent =
    "Update Notes";

  window.scrollTo({top: 0, behavior: "smooth"});
}

// DELETE NOTES

function deleteNote(id) {
  if (!confirm("Are you sure you want to delete this note?")) {
    return;
  }

  notes = notes.filter(n => n.id !== id);

  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  displayNotes();
}

// CLEAR / CANCEL EDIT

function cancelEdit() {
  editingId = null;
  document.getElementById("noteForm").reset();

  document.getElementById("noteDate").value =
    new Date().toLocaleDateString("en-CA");

  document.getElementById("saveButton").textContent =
    "Save Notes";
}

// EDIT PROFILE

function editProfile() {
  const p = JSON.parse(localStorage.getItem(PROFILE_KEY));

  document.getElementById("name").value = p.name;
  document.getElementById("email").value = p.email;
  document.getElementById("phone").value = p.phone;
  document.getElementById("regno").value = p.regno;
  document.getElementById("department").value = p.department;
  document.getElementById("semester").value = p.semester;

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("profileSection").classList.remove("hidden");
}

// LOGOUT

function logout() {
  if (confirm("Do you want to logout?")) {
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("profileSection").classList.remove("hidden");
    document.getElementById("profileForm").reset();
  }
}

</script>

</body>
</html>
